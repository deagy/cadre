# Pre-commit hooks for deagy/cadre
#
# Catalog consistency, schema validation, and generated-artifact drift checks.
# See: https://pre-commit.com/

repos:
  # YAML syntax validation for all YAML files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        # Single-quoted: a backslash inside a double-quoted YAML scalar is an
        # escape, and `\.` is not a valid one -- PyYAML rejects the whole
        # document, and pre-commit parses this config with PyYAML, so every
        # hook below silently never ran.
        files: '\.ya?ml$'
        exclude: '^roster/catalog\.yaml$|^roster/orchestration/routing\.yaml$'  # validated by `cadre schema-validate`
      - id: end-of-file-fixer
        files: "\\.md$"
      - id: trailing-whitespace
        files: "\\.md$"

  # Catalog.yaml ↔ agent-catalog.json consistency
  - repo: local
    hooks:
      - id: catalog-schema-validate
        name: Validate catalog.yaml and routing.json schemas
        entry: ./bin/cadre schema-validate
        language: system
        pass_filenames: false
        files: "roster/catalog\\.yaml$|roster/orchestration/routing\\.yaml$"

      # The catalog-health hook that stood here ran routing_health.py, which
      # linted orphaned and dangling role references and globs a rule excludes
      # away entirely. That linter is now
      # internal/orchestration/routing_health_test.go: it runs in `go test`
      # and in CI, rather than as a subcommand a hook could call. Re-adding a
      # hook here means adding a `cadre` command for it first.

      - id: staged-knowledge-records
        name: Check staged knowledge records are well-formed
        entry: python3 roster/knowledge-store/src/staged_records.py
        language: python
        pass_filenames: false
        files: "roster/knowledge-store/proposed-knowledge/.*\\.md$|roster/knowledge-store/proposed-knowledge\\.schema\\.json$"

      - id: generate-role-metadata-check
        name: Verify generated role metadata is in sync
        entry: ./bin/cadre generate-role-metadata --check
        language: system
        pass_filenames: false
        files: "roster/.*AGENT\\.md$|roster/catalog\\.yaml$|roster/catalog-order\\.txt$"
