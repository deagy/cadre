# golangci-lint v2 configuration for the Cadre Go CLI.
# Pinned tool version tracked in go.mod's `tool` block
# (github.com/golangci/golangci-lint/v2/cmd/golangci-lint); run with
# `go tool golangci-lint run ./...` (see Makefile's `lint` target) rather
# than a floating `@latest` install, per library-standards.yaml's
# version_policy: pin_exact_reviewed_tool_version.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - bodyclose
    - errorlint
    - unconvert
  exclusions:
    rules:
      # Test files exercise fake/failing subprocess and I/O paths where
      # every error is deliberately asserted on, not silently dropped --
      # errcheck's default noise on t.Fatal-adjacent helpers is not useful
      # here, but genuine unchecked errors in test *logic* still fail the
      # relevant test at runtime, so this is a lint-noise exclusion, not a
      # correctness relaxation.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
