title = "cadre gitleaks config"

# Extend (do not replace) gitleaks' built-in default ruleset. Every rule
# still runs everywhere in this repository; only the two narrow allowlist
# entries below are added on top.
[extend]
useDefault = true

# Both entries below are synthetic test fixtures in
# roster/orchestration/test/test_gitlab_integration.py, not real leaked
# credentials:
#
#   - glpat-FAKE-TEST-TOKEN-0000 is an obviously-fake placeholder token used
#     as this test module's FAKE_TOKEN constant, per its own established
#     convention for exercising token-resolution/redaction code paths
#     without ever using a realistic-looking value.
#   - glpat-SUPER-SECRET-LEAKED-VALUE is synthetic "secret-shaped" test data
#     used only in
#     AuditTrailTests.test_real_http_error_with_a_sensitive_response_body_never_reaches_the_audit_file
#     to prove this string never reaches the audit log after a simulated
#     GitLab error response.
#
# This allowlist is intentionally scoped on three axes AT ONCE -- rule ID,
# file path, AND the exact matched secret text all have to match -- so it
# cannot mask a real gitlab-pat leak anywhere else in the repository, in
# this file, or even a different-looking secret introduced into this same
# test file later. `condition = "AND"` is load-bearing here: gitleaks'
# allowlist `paths`/`regexes` conditions combine as OR unless this is set
# explicitly, which would otherwise make `paths` alone exempt the entire
# file from the gitlab-pat rule regardless of which secret it contains.
# Verified directly (not just read from gitleaks' docs): with
# `condition = "AND"` absent, a different gitlab-pat-shaped secret placed in
# this same file went undetected, while the exact allowlisted literal placed
# in a different file was still (correctly) flagged -- i.e. `paths` alone
# was already acting as a blanket exemption for this file.
#
# The second regex below is deliberately truncated to
# `glpat-SUPER-SECRET-LEAKED-` (not the fixture's full `...-VALUE` suffix):
# gitleaks' gitlab-pat rule captures a fixed 20-character secret after the
# `glpat-` prefix, so the text `regexes` is actually compared against is
# that truncated capture, not the full source-code literal -- an allowlist
# regex written against the full literal silently never matches (dead
# configuration), which is invisible under OR semantics (paths alone still
# suppresses it) but turns CI red the moment condition = "AND" makes the
# regex condition load-bearing. Re-verified against the real repository
# after this correction: zero leaks.
[[allowlists]]
condition = "AND"
targetRules = ["gitlab-pat"]
paths = [
  '''roster/orchestration/test/test_gitlab_integration\.py''',
]
regexes = [
  '''glpat-FAKE-TEST-TOKEN-0000''',
  '''glpat-SUPER-SECRET-LEAKED-''',
]

# `generic-api-key` fires on routing.yaml's `secrets-identity` route, where an
# agent-id array puts a long hyphenated role id immediately after the literal
# word `secrets`:
#
#   "primary":["secrets-identity-engineer","pkcs11-hsm-integration-implementer"]
#
# The rule's keyword proximity heuristic reads `secrets-identity-engineer` as
# the assignment keyword and the role id after it as the assigned value. There
# is no credential here -- both tokens are catalog role ids, and routing.yaml
# has never held a secret of any kind. This recurs by construction: every
# future role id routed alongside `secrets-identity-engineer` reproduces it.
#
# Scoped on the same three axes as the entry above -- rule ID, file path, and
# matched text, combined with `condition = "AND"` so all three must hold.
# Three deliberate scoping choices:
#
#   - `regexTarget = "match"` (not the default `secret`) so the allowlist is
#     conditioned on the *adjacency* to `secrets-identity-engineer`, not on the
#     role id alone. A role-id-shaped token anywhere else in these files is
#     still scanned normally.
#   - The trailing token is constrained to catalog role-id shape
#     (lowercase alphanumerics in hyphen-separated segments, at least two
#     segments) rather than a specific id, so it keeps holding as new
#     `*-implementer`/`*-engineer` roles join that route without needing a
#     config edit each time -- while excluding the mixed-case/underscore/
#     base64/hex shapes real credentials take.
#   - `paths` names both copies of the one file exhibiting this construct, not
#     a directory: `plugin/suite/roster/orchestration/routing.yaml` is the
#     generated mirror of `roster/orchestration/routing.yaml` and always
#     carries the identical line. routing.yaml is NOT blanket-exempted -- every
#     other rule still applies to it in full, and `generic-api-key` itself
#     still applies to every line of it that is not this exact construct.
[[allowlists]]
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''roster/orchestration/routing\.yaml''',
  '''plugin/suite/roster/orchestration/routing\.yaml''',
]
regexTarget = "match"
regexes = [
  '''secrets-identity-engineer","[a-z0-9]+(?:-[a-z0-9]+)+"''',
]
