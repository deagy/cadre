name: Release

# Tags and publishes a GitHub Release whenever a version bump lands on main.
#
# This repository carries three independent version lines, and that is
# deliberate -- provider/provider.json's kernel_compatibility window is only
# meaningful if the kernel can move separately from the role catalog, and
# internal/kernel/kernel_boundary_test.go asserts the kernel keeps
# its own distribution name and console script. So there are two release
# jobs, each with its own component-prefixed tag namespace:
#
#   plugin-v<version>   the packaged plugin distribution (plugin/**/plugin.json,
#                       all 8 manifests, see internal/cli/release_metadata.go)
#
# Prefixes are not cosmetic. This repository inherited 25 bare `v*` tags from
# the pre-monorepo deagy/cadre (v0.1.1 through v0.16.0, plus v1..v7), so a
# bare `v<version>` scheme collides: the plugin is at 0.10.1 and v0.11.0
# through v0.16.0 already exist, pointing at old-cadre history. The
# already-tagged check below would then match an unrelated tag and report
# "nothing to do" -- a silent no-op rather than a failure, which is the worst
# possible way for a release to break.
#
# Two independent guards stand between a push and a release, because they
# answer different questions and neither subsumes the other:
#
#   the `changed` job    did this push actually move a version? The `paths`
#                        filter below is file-level -- GitHub cannot filter on
#                        a JSON field -- so editing a manifest's description
#                        or its advertised role count starts this workflow.
#                        That is exactly what happened when the catalog went
#                        from 71 to 74 roles: a full Release run fired for a
#                        change that released nothing.
#   already-tagged       is this version already published? Covers a re-run,
#                        a manual workflow_dispatch, and a hand-created tag,
#                        none of which the version diff can see.
#
# The `changed` job deliberately fails open -- it reports "changed" whenever
# it has nothing to diff against (workflow_dispatch, a force-push, the
# all-zero before-sha) rather than silently skipping a real release. A
# needless run is cheap; a release that quietly does not happen is not.
on:
  push:
    timeout-minutes: 30
    branches: [main]
    paths:
      - "plugin/.claude-plugin/plugin.json"
      - "plugin/.codex-plugin/plugin.json"
      - "plugin/plugins/lifecycle/.claude-plugin/plugin.json"
      - "plugin/plugins/lifecycle/.codex-plugin/plugin.json"
      - "plugin/plugins/lifecycle-github/.claude-plugin/plugin.json"
      - "plugin/plugins/lifecycle-github/.codex-plugin/plugin.json"
      - "plugin/plugins/lifecycle-gitlab/.claude-plugin/plugin.json"
      - "plugin/plugins/lifecycle-gitlab/.codex-plugin/plugin.json"
      - "VERSION"
      # The kernel's version is a Go constant, not a marker file. Without this
      # a kernel bump changed nothing the trigger watches, so the workflow
      # never started -- the `changed` job would have reported kernel=true and
      # kernel-publish would have run, if either had ever been reached.
      - "internal/kernel/provider.go"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changed:
    name: Detect which versions changed
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.detect.outputs.plugin }}
      cli: ${{ steps.detect.outputs.cli }}
      kernel: ${{ steps.detect.outputs.kernel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # fetch-depth: 0 above is load-bearing for the step below: it resolves
      # `git show <before>:<path>`, which needs that commit present.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compare each component's version against the previous commit
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # The detection is Go (`internal/cli/release_gate.go`), not 85 lines
          # inlined here. It used to read the CLI version from
          # cadre_cli/_version.py; that marker moved to VERSION and nothing
          # tied the two together, so the file was absent at both ends of
          # every comparison, both sides read as nil, and the CLI silently
          # stopped being releasable. In Go the watched paths come from the
          # same lists the CLI and `cadre plugin-version` use, and a test
          # fails if one of them stops existing.
          go run ./cmd/cadre changed-components --event "$EVENT" --before "$BEFORE" >> "$GITHUB_OUTPUT"

  plugin:
    name: Release the plugin distribution
    timeout-minutes: 30
    needs: changed
    if: needs.changed.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    # Signing and publishing run under the `release` environment, which
    # requires an explicit approval and limits the allowed refs to `main` and
    # the `plugin-v*`/`kernel-v*` tags. Reaching `main` is not by itself
    # authorization to mint a signed, published release: the run waits for a
    # human to approve it, indefinitely, rather than proceeding unattended.
    #
    # Environment approval permits self-approval, unlike pull-request review
    # -- which is why a solo maintainer can use it as a real gate rather than
    # a wait timer that elapses whether or not anyone is watching.
    #
    # Note this gates *these jobs*, not the secret: while TAG_SIGNING_KEY is a
    # repository secret, any job that omits `environment:` still reads it
    # directly. Scoping the secret to this environment is what makes the gate
    # protect the key -- see .github/TAG-SIGNING-SETUP.md step 2.
    environment: release
    # Per-job: the SBOM below is attested, so this
    # needs the same Sigstore permissions.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The version and changelog helpers are Go now, so this job needs a
      # toolchain it did not before. `go run` rather than a built binary: it is
      # two short reads, and building dist/cadre here would duplicate what the
      # cli job already does per platform.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify manifests agree on a valid version
        run: go run ./cmd/cadre plugin-version --check

      - name: Read version
        id: version
        run: echo "value=$(go run ./cmd/cadre plugin-version)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: tag
        run: |
          if git rev-parse "refs/tags/plugin-v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "plugin-v${{ steps.version.outputs.value }} already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG entry
        if: steps.tag.outputs.skip == 'false'
        run: go run ./cmd/cadre changelog-entry "${{ steps.version.outputs.value }}" > /tmp/release-notes.md

      # SSH tag signing. The private key lives in the TAG_SIGNING_KEY secret
      # and the matching public key is registered on the account as a
      # *signing* key, which is what makes GitHub show these tags Verified.
      #
      # This is a deliberate reversal of the keyless posture used for
      # artifacts, and the reason is recorded in SECURITY.md: gitsign
      # produced tag signatures with no Rekor entry, so nothing could ever
      # verify them. A stored key is the cost of tag signatures that
      # actually verify.
      #
      # Skipped rather than failed when the secret is absent, so a fork or a
      # repository that has not set it up still releases -- unsigned, which
      # is honest, instead of not at all.
      - name: Set up tag signing
        id: signing
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${TAG_SIGNING_KEY:-}" ]; then
            echo "::warning::TAG_SIGNING_KEY is not set; tagging without a signature."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$RUNNER_TEMP/signing"
          printf '%s\n' "$TAG_SIGNING_KEY" > "$RUNNER_TEMP/signing/key"
          chmod 600 "$RUNNER_TEMP/signing/key"
          ssh-keygen -y -f "$RUNNER_TEMP/signing/key" > "$RUNNER_TEMP/signing/key.pub"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing/key"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.tag.outputs.skip == 'false'
        run: |
          # Tagger identity must belong to the account that owns the signing
          # key, or GitHub reports the signature as unknown_key however valid
          # it is -- it matches the key to the signer's account by email.
          # github-actions[bot]@users.noreply.github.com is not on that
          # account, which is exactly how plugin-v0.12.4 ended up signed,
          # locally verifiable, and still shown Unverified.
          #
          # The noreply form is used rather than a personal address: always
          # associated with the account, and it exposes nothing.
          git config user.name "deagy"
          git config user.email "48447733+deagy@users.noreply.github.com"
          # -s when a signing key is configured, -a otherwise.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            git tag -s "plugin-v${{ steps.version.outputs.value }}" \
              -m "Plugin distribution v${{ steps.version.outputs.value }}"
            # Fail the release if the signature does not verify. Unlike the
            # gitsign attempt, this check is fatal: a tag that cannot be
            # verified is the defect, not a hiccup to log and move past.
            printf 'signer %s\n' "$(cat "$RUNNER_TEMP/signing/key.pub")" > "$RUNNER_TEMP/signing/allowed_signers"
            git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/signing/allowed_signers" \
              tag -v "plugin-v${{ steps.version.outputs.value }}"
          else
            git tag -a "plugin-v${{ steps.version.outputs.value }}" \
              -m "Plugin distribution v${{ steps.version.outputs.value }}"
          fi
          git push origin "plugin-v${{ steps.version.outputs.value }}"

      # The packaged Claude Code / Codex plugin has *no* third-party surface:
      # Markdown and stdlib Python, no install step, and since the Cline
      # workspaces moved to cline-plugins/ there is no package.json anywhere
      # under plugin/. So this SBOM is not about that plugin -- it covers the
      # three Cline plugins, which ship from this same repository and tag and
      # are the only thing here with an npm dependency tree.
      #
      # Keeping them in plugin/ meant installing the Claude Code plugin ran
      # npm install and wrote 263 MB of this tree into every user's plugin
      # cache. Nothing about the tree itself changed -- only where it lives,
      # and therefore who has to download it.
      #
      # Scanned from package-lock.json rather than an installed
      # node_modules: the lockfile *is* the resolved tree, it is committed,
      # and reading it needs no `npm ci` -- so this cannot fail on a
      # registry outage during a release. (Scanning node_modules directly
      # returns 4 packages; the javascript cataloger wants the lockfile.)
      - name: Install syft
        if: steps.tag.outputs.skip == 'false'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate an SBOM for the Cline plugin dependencies
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          mkdir -p dist
          syft scan file:cline-plugins/package-lock.json \
            --select-catalogers javascript \
            --source-name cadre-plugin-cline \
            --source-version "${{ steps.version.outputs.value }}" \
            -o spdx-json=dist/cadre-plugin-cline-sbom.spdx.json
          # Fails the release rather than publishing a near-empty inventory,
          # which is what scanning the wrong path produces -- syft succeeds on
          # a path it found nothing in.
          go run ./cmd/cadre sbom-check dist/cadre-plugin-cline-sbom.spdx.json \
            --min 200 --require '@cline/sdk,@cline/shared,zod'

      # Attested because it is a real downloadable artifact. The plugin
      # itself deliberately gets no provenance: a marketplace installs by
      # cloning a git commit, so there is no downloaded file for a consumer
      # to verify, and building a tarball purely to have something to sign
      # would produce an artifact nobody installs from and that can drift
      # from what the marketplace serves.
      - name: Attest the SBOM
        if: steps.tag.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cadre-plugin-cline-sbom.spdx.json

      - name: Publish GitHub Release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "plugin-v${{ steps.version.outputs.value }}" \
            --title "Plugin distribution v${{ steps.version.outputs.value }}" \
            --notes-file /tmp/release-notes.md \
            --latest \
            dist/cadre-plugin-cline-sbom.spdx.json

  cli:
    name: Release the Cadre CLI (Go binaries)
    timeout-minutes: 30
    needs: changed
    if: needs.changed.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64: native build on ubuntu-latest
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            # PEP 425 platform tags. pip matches these against the installing
            # interpreter, so a wrong one serves the wrong architecture's
            # binary. manylinux_2_17 is the glibc floor these are built
            # against. linux/arm64 is not published for the CLI (see
            # internal/release.unpublishable): it needed a cross toolchain
            # installed with apt, which failed four releases running.
            platform-tag: manylinux_2_17_x86_64
          # macOS ARM64: native on macos-latest (currently arm64)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            platform-tag: macosx_11_0_arm64
          # No macOS AMD64 leg, deliberately. See internal/release's
          # `unpublishable`: the CLI links sqlite and so needs CGO_ENABLED=1
          # and a native host per platform. macos-13 provided that host free;
          # GitHub retired it, and the surviving Intel labels are a separate,
          # dearer SKU. darwin/arm64 does not cover Intel Macs -- Rosetta
          # translates x86_64 for Apple Silicon, not the reverse -- so Intel
          # macOS users build from source. `cadre release-assets` is the
          # contract; nothing here restates it.
          # Windows AMD64
          - os: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            exe-suffix: .exe
            platform-tag: win_amd64
          # NOTE: windows-arm64 is currently unsupported.
          # windows-latest is x64 with MinGW x86_64 gcc; cannot emit ARM64 objects with CGO_ENABLED=1.
          # Re-add if/when provisioning windows-11-arm hosted runner with proper cross-toolchain.
    environment: release
    # The matrix spans Linux, macOS and Windows, and the steps below are
    # written in sh. Without this, Windows runs them under pwsh, where
    # `set -eu` and `[ -n "$x" ]` are parse errors -- "Missing type name
    # after '['". Every such step failed on the first release that got far
    # enough to run one. The Windows-only archive step sets `shell: pwsh`
    # explicitly and overrides this.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Read CLI version
        id: version
        run: |
          set -eu
          value=$(tr -d '[:space:]' < VERSION)
          [ -n "$value" ] || { echo "CLI VERSION not found or not MAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: tag
        run: |
          if git rev-parse "refs/tags/cli-v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "cli-v${{ steps.version.outputs.value }} already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux cross-compilation toolchain
        if: steps.tag.outputs.skip == 'false' && matrix.apt-packages != ''
        # Bounded, and retried.
        #
        # apt-get has no timeout of its own: when a mirror accepts the
        # connection and then stops responding, it waits forever. This step did
        # exactly that on the linux/arm64 leg twice in a row, each time burning
        # the whole 30-minute job budget before the build had started, which
        # cancelled the leg and skipped the publish -- so a release failed on a
        # stalled mirror with every other platform already built.
        #
        # The job timeout is a backstop against a hang, not a retry policy. Each
        # apt call is bounded so a stall fails in minutes instead of thirty, and
        # three attempts ride out a mirror that is briefly unwell.
        timeout-minutes: 12
        run: |
          set -eu
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get update \
              && timeout 210 sudo apt-get install -y --no-install-recommends ${{ matrix.apt-packages }}; then
              echo "toolchain installed on attempt $attempt"
              exit 0
            fi
            echo "toolchain install attempt $attempt stalled or failed; retrying" >&2
            sleep 10
          done
          echo "ERROR: could not install ${{ matrix.apt-packages }} after 3 attempts" >&2
          exit 1

      - name: Build binary
        if: steps.tag.outputs.skip == 'false'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          set -eu
          mkdir -p dist
          # -tags sqlite_fts5: mattn/go-sqlite3 omits the FTS5 module by default,
          # and `cadre knowledge fts5-*` needs it. Without the tag the published
          # binary reports "no such module: fts5" and refuses those commands.
          go build -tags sqlite_fts5 -o "dist/cadre-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.exe-suffix }}" ./cmd/cadre
          # The engine ships in this release too, and needs the same cgo build:
          # it links the same sqlite checkpointer. Built with CGO_ENABLED=0 it
          # compiles and then fails at runtime saying go-sqlite3 is a stub.
          go build -o "dist/agentic-sdlc-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.exe-suffix }}" ./cmd/agentic-sdlc-engine

      - name: Smoke test binary on native platforms
        # Runs here, before the archive steps: each of those deletes the
        # binary after packing it, so a smoke test placed after them tests a
        # file that no longer exists. That is exactly what happened on the
        # first release to reach this step -- exit 127, "No such file or
        # directory", on every native leg.
        # Test the built binary on native (non-cross-compiled) platforms only.
        # linux-arm64 is cross-compiled and cannot run without emulation, so it is excluded.
        if: |
          steps.tag.outputs.skip == 'false' && (
            (matrix.goos == 'linux' && matrix.goarch == 'amd64') ||
            (matrix.goos == 'darwin') ||
            (matrix.goos == 'windows' && matrix.goarch == 'amd64')
          )
        shell: bash
        run: |
          set -eu
          binary="dist/cadre-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.exe-suffix }}"
          echo "Testing $binary..."
          $binary --version
          $binary knowledge --help
          engine="dist/agentic-sdlc-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.exe-suffix }}"
          echo "Testing $engine..."
          $engine --help

      - name: Create archive (tar.gz for Unix)
        if: steps.tag.outputs.skip == 'false' && matrix.goos != 'windows'
        run: |
          set -eu
          cd dist
          # Renamed to the contract name before archiving.
          #
          # The build output carries a platform suffix so four matrix legs can
          # coexist, but internal/release.ExecutableNameFor says the archive
          # contains "cadre" -- and this used to pack "cadre-linux-arm64", so
          # `tar xzf` gave you a binary that "extract and run cadre" could not
          # find. Shipped that way through 0.6.3. The kernel job never had the
          # bug because it builds straight to the contract name.
          mv "cadre-${{ matrix.goos }}-${{ matrix.goarch }}" cadre
          tar czf "cadre-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" cadre
          rm cadre
          mv "agentic-sdlc-engine-${{ matrix.goos }}-${{ matrix.goarch }}" agentic-sdlc-engine
          tar czf "agentic-sdlc-engine-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" agentic-sdlc-engine
          rm agentic-sdlc-engine

      - name: Create archive (zip for Windows)
        if: steps.tag.outputs.skip == 'false' && matrix.goos == 'windows'
        shell: pwsh
        run: |
          # Renamed to the contract name before archiving; see the tar.gz step.
          $binary = "dist\cadre-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          $archive = "dist\cadre-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          Move-Item $binary "dist\cadre.exe"
          Compress-Archive -Path "dist\cadre.exe" -DestinationPath $archive
          Remove-Item "dist\cadre.exe"
          $engine = "dist\agentic-sdlc-engine-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          $engineArchive = "dist\agentic-sdlc-engine-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          Move-Item $engine "dist\agentic-sdlc-engine.exe"
          Compress-Archive -Path "dist\agentic-sdlc-engine.exe" -DestinationPath $engineArchive
          Remove-Item "dist\agentic-sdlc-engine.exe"

      - name: Upload artifacts to workflow
        if: steps.tag.outputs.skip == 'false'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: cadre-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          # Both programs shipped under this tag. A path matching only cadre-v*
          # would upload the CLI and drop the engine, and the verify step below
          # would then be the first thing to notice.
          path: |
            dist/cadre-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.*
            dist/agentic-sdlc-engine-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 1

  cli-publish:
    name: Publish Cadre CLI release
    timeout-minutes: 30
    needs: [changed, cli]
    if: needs.changed.outputs.cli == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # `sbom-check` below is a Go command, so this job needs a toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Read CLI version
        id: version
        run: |
          set -eu
          # VERSION, not cadre_cli/_version.py: that marker moved when the last
          # Python left the distribution, and this step was not updated with
          # the one in the `cli` job above. Under `set -eu` the grep aborts, so
          # every CLI publish failed here rather than mis-tagging.
          value=$(tr -d '[:space:]' < VERSION)
          [ -n "$value" ] || { echo "CLI VERSION not found" >&2; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: tag
        run: |
          if git rev-parse "refs/tags/cli-v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "cli-v${{ steps.version.outputs.value }} already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        if: steps.tag.outputs.skip == 'false'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist

      - name: Flatten artifacts directory
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          mkdir -p flat-dist
          # -o binds looser than an implicit -a, so the name tests are grouped
          # explicitly. Without the parentheses a later predicate would apply to
          # only the last alternative.
          find dist \( -name "cadre-v*.tar.gz" -o -name "cadre-v*.zip" \
            -o -name "agentic-sdlc-engine-v*.tar.gz" -o -name "agentic-sdlc-engine-v*.zip" \) \
            | while read -r f; do
            cp "$f" flat-dist/
          done

      - name: Verify all contracted platforms are present
        # The expected asset list comes from internal/release, not from a set
        # retyped here. It used to be an inline Python block whose comment
        # read "Five platforms"; that comment was the only statement of the
        # contract in this job, and a comment cannot fail. The CLI now
        # publishes four -- darwin/amd64 is excluded, with its reason, in
        # internal/release's `unpublishable` -- while the kernel still
        # publishes five, so any single list written here is wrong for one of
        # the two jobs.
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          # Both programs ship under this tag, so both are verified. Listing only
          # the CLI would let an engine asset go missing silently.
          go run ./cmd/cadre release-assets --program cadre --version "$version" > expected-assets.txt
          go run ./cmd/cadre release-assets --program agentic-sdlc-engine --version "$version" >> expected-assets.txt
          # An empty list would make every check below vacuously true: zero
          # assets expected, zero missing, "all 0 present", exit 0. That is the
          # shape of a guard that passes while asserting nothing.
          [ -s expected-assets.txt ] || { echo "ERROR: the platform contract produced no assets" >&2; exit 1; }
          missing=""
          count=0
          # Read from a file, not a pipe: `while read` in a pipeline runs in a
          # subshell and $missing would be empty again by the time it is tested.
          while read -r asset; do
            count=$((count + 1))
            [ -f "flat-dist/$asset" ] || missing="$missing $asset"
          done < expected-assets.txt
          if [ -n "$missing" ]; then
            echo "ERROR: missing contracted archives:$missing" >&2
            echo "present:" >&2
            ls -1 flat-dist >&2
            exit 1
          fi
          echo "all $count contracted platforms present"

      # Phase 2 of PYTHON_ELIMINATION_PLAN.md: `pip install cadre` ships the
      # binary, not Python. One wheel per platform, each carrying the *same*
      # binary that platform's archive carries -- built here from the archives
      # rather than on each matrix runner, which guarantees that and also
      # avoids needing make, tar and a Python toolchain on the Windows runner.
      - name: Set up Python for wheel building
        if: steps.tag.outputs.skip == 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install wheel build tools
        if: steps.tag.outputs.skip == 'false'
        run: pip install --no-cache-dir build==1.5.0 wheel==0.46.3

      - name: Build one wheel per platform
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          mkdir -p wheel-binaries

          # goos goarch platform-tag exe-suffix. Kept in step with the build
          # matrix above and with internal/release/platforms.go, which the
          # contract test guards.
          while read -r goos goarch tag suffix; do
            archive="flat-dist/cadre-v$version-$goos-$goarch"
            if [ "$goos" = "windows" ]; then
              unzip -o -q "$archive.zip" -d wheel-binaries
            else
              tar xzf "$archive.tar.gz" -C wheel-binaries
            fi
            # The contract name, matching what the archive step now packs.
            # This read cadre-$goos-$goarch$suffix -- the *build* output name --
            # and broke the moment the archives started carrying the name
            # internal/release.ExecutableNameFor promises. Producer and consumer
            # of the same archive, in one file, disagreeing.
            binary="wheel-binaries/cadre$suffix"
            test -f "$binary" || { echo "no binary extracted for $goos/$goarch" >&2; exit 1; }

            make wheel WHEEL_BINARY="$binary" PLATFORM_TAG="$tag" WHEEL_EXE_SUFFIX="$suffix"

            built=$(ls dist/cadre-*-"$tag".whl)
            cp "$built" flat-dist/
            echo "built $(basename "$built")"
          done <<'PLATFORMS'
          linux amd64 manylinux_2_17_x86_64 
          darwin arm64 macosx_11_0_arm64 
          windows amd64 win_amd64 .exe
          PLATFORMS

      - name: Every wheel must carry a binary, its data, and no Python
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          count=0
          for wheel in flat-dist/*.whl; do
            count=$((count + 1))
            # The whole point of the phase. A wheel that regained a .py would
            # still install and still work, so nothing else would notice.
            if python -m zipfile -l "$wheel" | grep -q '\.py$'; then
              echo "$wheel contains Python source" >&2
              exit 1
            fi
            # No trailing anchor: `zipfile -l` prints name, date and size in
            # columns, so an end-of-line match never fires and the check
            # silently passes every wheel, including one with no binary.
            python -m zipfile -l "$wheel" | grep -qE 'data/scripts/cadre(\.exe)?[[:space:]]' \
              || { echo "$wheel has no cadre binary" >&2; exit 1; }
            # hatchling's shared-data silently drops directory sources, which
            # produces a wheel that builds cleanly and is missing every role.
            roles=$(python -m zipfile -l "$wheel" | grep -c 'share/cadre/roster/.*/AGENT\.md' || true)
            if [ "$roles" -lt 100 ]; then
              echo "$wheel carries only $roles role definitions" >&2
              exit 1
            fi
            echo "$(basename "$wheel"): 0 python, binary present, $roles roles"
          done
          # One wheel per platform the CLI publishes, counted from the contract
          # rather than written here. This said 5. Dropping the darwin/amd64 leg
          # made it 4, and nothing connected the two, so the release failed at
          # the last job -- after every build had succeeded -- on a number.
          expected=$(go run ./cmd/cadre release-assets --program cadre --version "${{ steps.version.outputs.value }}" | wc -l)
          [ "$expected" -gt 0 ] || { echo "the platform contract produced no assets" >&2; exit 1; }
          test "$count" -eq "$expected" || { echo "expected $expected wheels, found $count" >&2; exit 1; }
          echo "$count wheels, one per contracted platform"

      - name: Install syft
        if: steps.tag.outputs.skip == 'false'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOM for CLI Go dependencies
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          syft scan dir:. \
            --select-catalogers go \
            --source-name cadre-cli \
            --source-version "${{ steps.version.outputs.value }}" \
            -o spdx-json=flat-dist/cadre-cli-sbom.spdx.json
          go run ./cmd/cadre sbom-check flat-dist/cadre-cli-sbom.spdx.json \
            --min 5 --require github.com/mattn/go-sqlite3

      - name: Checksum the artifacts
        if: steps.tag.outputs.skip == 'false'
        working-directory: flat-dist
        run: sha256sum * > SHA256SUMS

      - name: Attest build provenance
        if: steps.tag.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            flat-dist/cadre-v*.tar.gz
            flat-dist/cadre-v*.zip
            flat-dist/cadre-cli-sbom.spdx.json
            flat-dist/SHA256SUMS

      - name: Set up tag signing
        if: steps.tag.outputs.skip == 'false'
        id: signing
        env:
          TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${TAG_SIGNING_KEY:-}" ]; then
            echo "::warning::TAG_SIGNING_KEY is not set; tagging without a signature."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$RUNNER_TEMP/signing"
          printf '%s\n' "$TAG_SIGNING_KEY" > "$RUNNER_TEMP/signing/key"
          chmod 600 "$RUNNER_TEMP/signing/key"
          ssh-keygen -y -f "$RUNNER_TEMP/signing/key" > "$RUNNER_TEMP/signing/key.pub"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing/key"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.tag.outputs.skip == 'false'
        run: |
          git config user.name "deagy"
          git config user.email "48447733+deagy@users.noreply.github.com"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            git tag -s "cli-v${{ steps.version.outputs.value }}" \
              -m "Cadre CLI v${{ steps.version.outputs.value }}"
            printf 'signer %s\n' "$(cat "$RUNNER_TEMP/signing/key.pub")" > "$RUNNER_TEMP/signing/allowed_signers"
            git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/signing/allowed_signers" \
              tag -v "cli-v${{ steps.version.outputs.value }}"
          else
            git tag -a "cli-v${{ steps.version.outputs.value }}" \
              -m "Cadre CLI v${{ steps.version.outputs.value }}"
          fi
          git push origin "cli-v${{ steps.version.outputs.value }}"

      - name: Publish GitHub Release with artifacts
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "cli-v${{ steps.version.outputs.value }}" \
            --title "Cadre CLI v${{ steps.version.outputs.value }}" \
            --notes "Go-based Cadre CLI v${{ steps.version.outputs.value }} for Linux, macOS, and Windows. Verify downloads against SHA256SUMS." \
            --latest=false \
            flat-dist/*

  # The kernel publishes on its own tag line because it versions on its own.
  # Providers declare kernel_compatibility against kernel.Version, which moves
  # independently of the CLI's version, so an asset named for the CLI's version
  # would not tell a consumer which kernel they were getting.
  #
  # One job rather than the cli/cli-publish pair, because there is nothing to
  # fan in: the kernel links no cgo, so every platform cross-compiles on this
  # runner. TestTheKernelBuildsWithoutCgo pins the property that makes that
  # valid -- if the kernel ever needs cgo, that test fails and this job has to
  # become a matrix.
