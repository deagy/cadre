name: Release

# Tags and publishes a GitHub Release whenever a version bump lands on main.
#
# This repository carries three independent version lines, and that is
# deliberate -- provider/provider.json's kernel_compatibility window is only
# meaningful if the kernel can move separately from the role catalog, and
# roster/orchestration/test/test_kernel_boundary.py asserts the kernel keeps
# its own distribution name and console script. So there are two release
# jobs, each with its own component-prefixed tag namespace:
#
#   plugin-v<version>   the packaged plugin distribution (plugin/**/plugin.json,
#                       all 8 manifests, see plugin/tools/plugin_version.py)
#   kernel-v<version>   the G1-G10 kernel (kernel/agentic_sdlc/__init__.py)
#
# Prefixes are not cosmetic. This repository inherited 25 bare `v*` tags from
# the pre-monorepo deagy/cadre (v0.1.1 through v0.16.0, plus v1..v7), so a
# bare `v<version>` scheme collides: the plugin is at 0.10.1 and v0.11.0
# through v0.16.0 already exist, pointing at old-cadre history. The
# already-tagged check below would then match an unrelated tag and report
# "nothing to do" -- a silent no-op rather than a failure, which is the worst
# possible way for a release to break.
#
# Two independent guards stand between a push and a release, because they
# answer different questions and neither subsumes the other:
#
#   the `changed` job    did this push actually move a version? The `paths`
#                        filter below is file-level -- GitHub cannot filter on
#                        a JSON field -- so editing a manifest's description
#                        or its advertised role count starts this workflow.
#                        That is exactly what happened when the catalog went
#                        from 71 to 74 roles: a full Release run fired for a
#                        change that released nothing.
#   already-tagged       is this version already published? Covers a re-run,
#                        a manual workflow_dispatch, and a hand-created tag,
#                        none of which the version diff can see.
#
# The `changed` job deliberately fails open -- it reports "changed" whenever
# it has nothing to diff against (workflow_dispatch, a force-push, the
# all-zero before-sha) rather than silently skipping a real release. A
# needless run is cheap; a release that quietly does not happen is not.
on:
  push:
    branches: [main]
    paths:
      - "plugin/.claude-plugin/plugin.json"
      - "plugin/.codex-plugin/plugin.json"
      - "plugin/plugins/lifecycle/.claude-plugin/plugin.json"
      - "plugin/plugins/lifecycle/.codex-plugin/plugin.json"
      - "plugin/plugins/lifecycle-github/.claude-plugin/plugin.json"
      - "plugin/plugins/lifecycle-github/.codex-plugin/plugin.json"
      - "plugin/plugins/lifecycle-gitlab/.claude-plugin/plugin.json"
      - "plugin/plugins/lifecycle-gitlab/.codex-plugin/plugin.json"
      - "kernel/agentic_sdlc/__init__.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changed:
    name: Detect which versions changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.detect.outputs.plugin }}
      kernel: ${{ steps.detect.outputs.kernel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare each component's version against the previous commit
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys

          before = os.environ.get("BEFORE", "")
          event = os.environ["EVENT"]

          def at(ref, path):
              """The file's text at `ref`, or None when it is not there."""
              result = subprocess.run(
                  ["git", "show", f"{ref}:{path}"],
                  capture_output=True, text=True, encoding="utf-8",
              )
              return result.stdout if result.returncode == 0 else None

          def manifest_version(text):
              if text is None:
                  return None
              try:
                  return json.loads(text).get("version")
              except json.JSONDecodeError:
                  # Unparseable is not "unchanged" -- let the job run and let
                  # plugin_version.py --check report it properly.
                  return "<unparseable>"

          def kernel_version(text):
              if text is None:
                  return None
              match = re.search(r'^VERSION = "(\d+\.\d+\.\d+)"', text, re.MULTILINE)
              return match.group(1) if match else "<unreadable>"

          # All 8 plugin manifests, not just the first: if a bump lands in
          # only some of them, this must still run so plugin_version.py
          # --check can fail on the disagreement instead of the release
          # being silently skipped.
          PLUGIN_MANIFESTS = [
              "plugin/.claude-plugin/plugin.json",
              "plugin/.codex-plugin/plugin.json",
              "plugin/plugins/lifecycle/.claude-plugin/plugin.json",
              "plugin/plugins/lifecycle/.codex-plugin/plugin.json",
              "plugin/plugins/lifecycle-github/.claude-plugin/plugin.json",
              "plugin/plugins/lifecycle-github/.codex-plugin/plugin.json",
              "plugin/plugins/lifecycle-gitlab/.claude-plugin/plugin.json",
              "plugin/plugins/lifecycle-gitlab/.codex-plugin/plugin.json",
          ]

          def commit_exists(ref):
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{ref}^{{commit}}"],
                  capture_output=True,
              ).returncode == 0

          # Nothing to diff against: workflow_dispatch carries no before-sha,
          # and a force-push or a branch's first push reports all zeros.
          # Fail open and let the already-tagged check decide.
          comparable = (
              event == "push"
              and before
              and set(before) != {"0"}
              and commit_exists(before)
          )
          if not comparable:
              print(f"no comparable previous commit (event={event}, before={before!r});"
                    " treating every component as changed", file=sys.stderr)

          components = {
              "plugin": (PLUGIN_MANIFESTS, manifest_version),
              "kernel": (["kernel/agentic_sdlc/__init__.py"], kernel_version),
          }
          for name, (paths, read) in components.items():
              if not comparable:
                  print(f"{name}=true")
                  continue
              moved = [
                  (path, read(at(before, path)), read(at("HEAD", path)))
                  for path in paths
              ]
              moved = [entry for entry in moved if entry[1] != entry[2]]
              for path, was, now in moved:
                  print(f"{name}: {path} {was} -> {now}", file=sys.stderr)
              if not moved:
                  print(f"{name}: version unchanged in this push; not releasing", file=sys.stderr)
              print(f"{name}={'true' if moved else 'false'}")
          PY

  plugin:
    name: Release the plugin distribution
    needs: changed
    if: needs.changed.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    # Signing and publishing run under the `release` environment, which
    # carries a wait timer and a deployment-branch policy limiting it to
    # `main` and the `plugin-v*`/`kernel-v*` tags. Reaching `main` is not by
    # itself authorization to mint a signed, published release: the timer is
    # the cancellation window for a publish nobody meant to trigger, and with
    # a single maintainer it is the solo-workable stand-in for a required
    # reviewer, which GitHub cannot ask of the same person who authored the
    # change. Scoping TAG_SIGNING_KEY to this environment (rather than the
    # repository) is what makes the gate load-bearing rather than advisory --
    # see .github/TAG-SIGNING-SETUP.md.
    environment: release
    # Per-job, matching the kernel job: the SBOM below is attested, so this
    # needs the same Sigstore permissions.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify manifests agree on a valid version
        run: python3 plugin/tools/plugin_version.py --check

      - name: Read version
        id: version
        run: echo "value=$(python3 plugin/tools/plugin_version.py)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: tag
        run: |
          if git rev-parse "refs/tags/plugin-v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "plugin-v${{ steps.version.outputs.value }} already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG entry
        if: steps.tag.outputs.skip == 'false'
        run: python3 plugin/tools/changelog_entry.py "${{ steps.version.outputs.value }}" > /tmp/release-notes.md

      # SSH tag signing. The private key lives in the TAG_SIGNING_KEY secret
      # and the matching public key is registered on the account as a
      # *signing* key, which is what makes GitHub show these tags Verified.
      #
      # This is a deliberate reversal of the keyless posture used for
      # artifacts, and the reason is recorded in SECURITY.md: gitsign
      # produced tag signatures with no Rekor entry, so nothing could ever
      # verify them. A stored key is the cost of tag signatures that
      # actually verify.
      #
      # Skipped rather than failed when the secret is absent, so a fork or a
      # repository that has not set it up still releases -- unsigned, which
      # is honest, instead of not at all.
      - name: Set up tag signing
        id: signing
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${TAG_SIGNING_KEY:-}" ]; then
            echo "::warning::TAG_SIGNING_KEY is not set; tagging without a signature."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$RUNNER_TEMP/signing"
          printf '%s\n' "$TAG_SIGNING_KEY" > "$RUNNER_TEMP/signing/key"
          chmod 600 "$RUNNER_TEMP/signing/key"
          ssh-keygen -y -f "$RUNNER_TEMP/signing/key" > "$RUNNER_TEMP/signing/key.pub"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing/key"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.tag.outputs.skip == 'false'
        run: |
          # Tagger identity must belong to the account that owns the signing
          # key, or GitHub reports the signature as unknown_key however valid
          # it is -- it matches the key to the signer's account by email.
          # github-actions[bot]@users.noreply.github.com is not on that
          # account, which is exactly how plugin-v0.12.4 ended up signed,
          # locally verifiable, and still shown Unverified.
          #
          # The noreply form is used rather than a personal address: always
          # associated with the account, and it exposes nothing.
          git config user.name "deagy"
          git config user.email "48447733+deagy@users.noreply.github.com"
          # -s when a signing key is configured, -a otherwise.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            git tag -s "plugin-v${{ steps.version.outputs.value }}" \
              -m "Plugin distribution v${{ steps.version.outputs.value }}"
            # Fail the release if the signature does not verify. Unlike the
            # gitsign attempt, this check is fatal: a tag that cannot be
            # verified is the defect, not a hiccup to log and move past.
            printf 'signer %s\n' "$(cat "$RUNNER_TEMP/signing/key.pub")" > "$RUNNER_TEMP/signing/allowed_signers"
            git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/signing/allowed_signers" \
              tag -v "plugin-v${{ steps.version.outputs.value }}"
          else
            git tag -a "plugin-v${{ steps.version.outputs.value }}" \
              -m "Plugin distribution v${{ steps.version.outputs.value }}"
          fi
          git push origin "plugin-v${{ steps.version.outputs.value }}"

      # The packaged Claude Code / Codex plugin has *no* third-party surface:
      # Markdown and stdlib Python, no install step, and since the Cline
      # workspaces moved to cline-plugins/ there is no package.json anywhere
      # under plugin/. So this SBOM is not about that plugin -- it covers the
      # three Cline plugins, which ship from this same repository and tag and
      # are the only thing here with an npm dependency tree.
      #
      # Keeping them in plugin/ meant installing the Claude Code plugin ran
      # npm install and wrote 263 MB of this tree into every user's plugin
      # cache. Nothing about the tree itself changed -- only where it lives,
      # and therefore who has to download it.
      #
      # Scanned from package-lock.json rather than an installed
      # node_modules: the lockfile *is* the resolved tree, it is committed,
      # and reading it needs no `npm ci` -- so this cannot fail on a
      # registry outage during a release. (Scanning node_modules directly
      # returns 4 packages; the javascript cataloger wants the lockfile.)
      - name: Install syft
        if: steps.tag.outputs.skip == 'false'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate an SBOM for the Cline plugin dependencies
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          mkdir -p dist
          syft scan file:cline-plugins/package-lock.json \
            --select-catalogers javascript \
            --source-name cadre-plugin-cline \
            --source-version "${{ steps.version.outputs.value }}" \
            -o spdx-json=dist/cadre-plugin-cline-sbom.spdx.json
          python3 -c "
          import json, pathlib
          d = json.loads(pathlib.Path('dist/cadre-plugin-cline-sbom.spdx.json').read_text())
          names = {p['name'] for p in d.get('packages', []) if p.get('name')}
          # Fails the release rather than publishing a near-empty inventory,
          # which is what scanning the wrong path produces.
          assert len(names) >= 200, f'SBOM has only {len(names)} packages'
          for required in ('@cline/sdk', '@cline/shared', 'zod'):
              assert required in names, f'{required} missing from SBOM'
          print(f'SBOM lists {len(names)} distinct packages')
          "

      # Attested because it is a real downloadable artifact. The plugin
      # itself deliberately gets no provenance: a marketplace installs by
      # cloning a git commit, so there is no downloaded file for a consumer
      # to verify, and building a tarball purely to have something to sign
      # would produce an artifact nobody installs from and that can drift
      # from what the marketplace serves.
      - name: Attest the SBOM
        if: steps.tag.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cadre-plugin-cline-sbom.spdx.json

      - name: Publish GitHub Release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "plugin-v${{ steps.version.outputs.value }}" \
            --title "Plugin distribution v${{ steps.version.outputs.value }}" \
            --notes-file /tmp/release-notes.md \
            --latest \
            dist/cadre-plugin-cline-sbom.spdx.json

  kernel:
    name: Release the lifecycle kernel
    needs: changed
    if: needs.changed.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    # Signing and publishing run under the `release` environment, which
    # carries a wait timer and a deployment-branch policy limiting it to
    # `main` and the `plugin-v*`/`kernel-v*` tags. Reaching `main` is not by
    # itself authorization to mint a signed, published release: the timer is
    # the cancellation window for a publish nobody meant to trigger, and with
    # a single maintainer it is the solo-workable stand-in for a required
    # reviewer, which GitHub cannot ask of the same person who authored the
    # change. Scoping TAG_SIGNING_KEY to this environment (rather than the
    # repository) is what makes the gate load-bearing rather than advisory --
    # see .github/TAG-SIGNING-SETUP.md.
    environment: release
    # Declared per-job rather than at the workflow level so the plugin job
    # above does not also gain the ability to mint attestations it never
    # uses. A job-level block replaces the workflow-level one outright, so
    # contents: write has to be repeated here.
    permissions:
      contents: write
      # attest-build-provenance mints a Sigstore certificate from this
      # workflow's OIDC identity and records the attestation against this
      # repository -- there is no signing key to manage or rotate.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Read kernel version
        id: version
        run: |
          set -eu
          value=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('kernel/agentic_sdlc/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^VERSION = \"(\d+\.\d+\.\d+)\"', text, re.MULTILINE)
          if not match:
              raise SystemExit('kernel VERSION not found or not MAJOR.MINOR.PATCH')
          print(match.group(1))
          ")
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Verify the kernel version satisfies provider.json's compatibility window
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, pathlib
          version = os.environ["KERNEL_VERSION"]
          window = json.loads(pathlib.Path("provider/provider.json").read_text())["kernel_compatibility"]

          def parts(value):
              return tuple(int(p) for p in value.split("."))

          if not parts(window["minimum"]) <= parts(version) < parts(window["maximum_exclusive"]):
              raise SystemExit(
                  f"kernel {version} falls outside provider.json's declared window "
                  f"[{window['minimum']}, {window['maximum_exclusive']}). Releasing it would "
                  "ship a kernel this repository's own provider refuses to run."
              )
          print(f"kernel {version} is inside [{window['minimum']}, {window['maximum_exclusive']})")
          PY
        env:
          KERNEL_VERSION: ${{ steps.version.outputs.value }}

      - name: Skip if this version is already tagged
        id: tag
        run: |
          if git rev-parse "refs/tags/kernel-v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "kernel-v${{ steps.version.outputs.value }} already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Version-pinned for the same reason validate.yml pins it: a single
      # build-only tool, not part of the hash-pinned requirements lock.
      - name: Build wheel and sdist
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          pip install --no-cache-dir build==1.5.0
          python -m build --wheel --sdist --outdir dist ./kernel

      # The SBOM describes the *resolved* dependency tree, so it has to be
      # taken from an environment where the wheel is actually installed.
      # Scanning kernel/ instead reads pyproject.toml and finds exactly one
      # package (jsonschema), which is a declaration, not an inventory --
      # what really lands is 19 distributions, most of them pulled in
      # beneath jsonschema.
      #
      # This mirrors what bootstrap_sdlc.py does on a user's machine: create
      # a venv, pip install the wheel. So the SBOM describes the environment
      # a consumer ends up with, pip included, rather than a hypothetical.
      - name: Install the built wheel into a throwaway venv
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install --no-cache-dir --disable-pip-version-check dist/*.whl
          # Resolved rather than hardcoded: the path carries the minor version.
          echo "SITE_PACKAGES=$(
            "$RUNNER_TEMP/sbom-venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])'
          )" >> "$GITHUB_ENV"

      # Run syft directly rather than through sbom-action: the action exposes
      # no cataloger selection or source naming, and without them the output
      # carries six "Simple Launcher" binaries and a package named after the
      # scan path.
      - name: Install syft
        if: steps.tag.outputs.skip == 'false'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate an SBOM of the resolved dependency tree
        if: steps.tag.outputs.skip == 'false'
        run: |
          set -eu
          syft scan "dir:$SITE_PACKAGES" \
            --select-catalogers python \
            --source-name agentic-sdlc \
            --source-version "${{ steps.version.outputs.value }}" \
            -o spdx-json=dist/agentic-sdlc-sbom.spdx.json
          python3 -c "
          import json, pathlib
          d = json.loads(pathlib.Path('dist/agentic-sdlc-sbom.spdx.json').read_text())
          names = {p['name'] for p in d.get('packages', []) if p.get('name')}
          # Guards the whole point of this step: if the scan silently reverts
          # to reading declarations, this is 2 and the release should fail
          # rather than publish a misleading inventory.
          assert len(names) >= 15, f'SBOM has only {len(names)} packages: {sorted(names)}'
          assert 'jsonschema' in names and 'rpds-py' in names, sorted(names)
          print(f'SBOM lists {len(names)} distinct packages')
          "

      # bootstrap_sdlc.py installs the kernel from a release asset rather than
      # a git ref so the download can be hash-checked. A moving tag cannot be
      # pinned, and a git+ URL additionally needs git and direct GitHub
      # access -- the first thing a corporate proxy breaks.
      #
      # Runs after the SBOM so SHA256SUMS covers it too; bootstrap_sdlc.py
      # selects the line ending in .whl, so the extra lines are inert there.
      - name: Checksum the artifacts
        if: steps.tag.outputs.skip == 'false'
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # What this buys over the checksums already published: SHA256SUMS says
      # the download matches what the release holds, but it is served by the
      # same release and says nothing about which build produced it.
      # Provenance binds these artifacts to this workflow, at this commit, in
      # this repository. Consumers verify with:
      #   gh attestation verify <file> --repo deagy/cadre
      #
      # Guarded by the same skip flag as everything above, so a re-run
      # against an existing tag never re-attests it.
      - name: Attest build provenance
        if: steps.tag.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/agentic-sdlc-sbom.spdx.json

      # SSH tag signing. The private key lives in the TAG_SIGNING_KEY secret
      # and the matching public key is registered on the account as a
      # *signing* key, which is what makes GitHub show these tags Verified.
      #
      # This is a deliberate reversal of the keyless posture used for
      # artifacts, and the reason is recorded in SECURITY.md: gitsign
      # produced tag signatures with no Rekor entry, so nothing could ever
      # verify them. A stored key is the cost of tag signatures that
      # actually verify.
      #
      # Skipped rather than failed when the secret is absent, so a fork or a
      # repository that has not set it up still releases -- unsigned, which
      # is honest, instead of not at all.
      - name: Set up tag signing
        id: signing
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${TAG_SIGNING_KEY:-}" ]; then
            echo "::warning::TAG_SIGNING_KEY is not set; tagging without a signature."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$RUNNER_TEMP/signing"
          printf '%s\n' "$TAG_SIGNING_KEY" > "$RUNNER_TEMP/signing/key"
          chmod 600 "$RUNNER_TEMP/signing/key"
          ssh-keygen -y -f "$RUNNER_TEMP/signing/key" > "$RUNNER_TEMP/signing/key.pub"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing/key"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.tag.outputs.skip == 'false'
        run: |
          # Tagger identity must belong to the account that owns the signing
          # key, or GitHub reports the signature as unknown_key however valid
          # it is -- it matches the key to the signer's account by email.
          # github-actions[bot]@users.noreply.github.com is not on that
          # account, which is exactly how plugin-v0.12.4 ended up signed,
          # locally verifiable, and still shown Unverified.
          #
          # The noreply form is used rather than a personal address: always
          # associated with the account, and it exposes nothing.
          git config user.name "deagy"
          git config user.email "48447733+deagy@users.noreply.github.com"
          # -s when a signing key is configured, -a otherwise.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            git tag -s "kernel-v${{ steps.version.outputs.value }}" \
              -m "Lifecycle kernel v${{ steps.version.outputs.value }}"
            # Fail the release if the signature does not verify. Unlike the
            # gitsign attempt, this check is fatal: a tag that cannot be
            # verified is the defect, not a hiccup to log and move past.
            printf 'signer %s\n' "$(cat "$RUNNER_TEMP/signing/key.pub")" > "$RUNNER_TEMP/signing/allowed_signers"
            git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/signing/allowed_signers" \
              tag -v "kernel-v${{ steps.version.outputs.value }}"
          else
            git tag -a "kernel-v${{ steps.version.outputs.value }}" \
              -m "Lifecycle kernel v${{ steps.version.outputs.value }}"
          fi
          git push origin "kernel-v${{ steps.version.outputs.value }}"

      # --latest=false, not merely omitting --latest: gh defaults to marking
      # the newest release as latest, so omitting it is not neutral. The
      # kernel job runs after the plugin job, so the default handed the
      # headline release to the kernel -- which is not what an end user
      # installs. Observed on the first real run.
      - name: Publish GitHub Release with artifacts
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "kernel-v${{ steps.version.outputs.value }}" \
            --title "Lifecycle kernel v${{ steps.version.outputs.value }}" \
            --notes "G1-G10 lifecycle kernel v${{ steps.version.outputs.value }}. Verify downloads against SHA256SUMS." \
            --latest=false \
            dist/*
