name: CI/CD Pipeline

on:
  push:
    branches: [ main, release/go-cli, feature/* ]
  pull_request:
    branches: [ main, release/go-cli ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test job
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./... > benchmarks.txt || true

      - name: Store benchmark
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/release/go-cli'
        with:
          tool: 'go'
          output-file-path: benchmarks.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vet code
        run: go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code formatting issues found:"
            gofmt -l .
            exit 1
          fi

      - name: Run goimports
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run GoSec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt json -out gosec-report.json ./...'

      - name: Upload GoSec results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: gosec-report.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif

      - name: SLSA provenance generation
        uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v1.9.0
        if: github.ref == 'refs/heads/release/go-cli' && github.event_name == 'push'
        with:
          go-version: '1.21'

  # Build container image
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/release/go-cli' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/release/go-cli' && github.event_name == 'push'
    environment:
      name: staging
      url: https://cadre-staging.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to staging
        run: |
          kubectl set image deployment/cadre \
            cadre=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release-go-cli-${{ github.sha }} \
            -n cadre-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cadre -n cadre-staging --timeout=5m

      - name: Verify deployment
        run: |
          kubectl exec -n cadre-staging deployment/cadre -- curl -s http://localhost:8080/health

  # Integration tests
  integration-tests:
    name: Integration Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/release/go-cli'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run integration tests
        run: go test -v -tags=integration ./...
        env:
          CADRE_URL: https://cadre-staging.example.com

  # Load testing
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/release/go-cli'
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.0
        with:
          filename: load-test.js
          cloud: false
        env:
          K6_VUS: 50
          K6_DURATION: 5m
          CADRE_URL: https://cadre-staging.example.com

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [integration-tests, load-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          git log --oneline $(git describe --tags --abbrev=0)..HEAD > CHANGELOG_TEMP.md
          cat CHANGELOG_TEMP.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/cadre
            docs/DEPLOYMENT_GUIDE.md
            docs/TROUBLESHOOTING_GUIDE.md
            docs/OPERATIONS_MANUAL.md
          body_path: CHANGELOG_TEMP.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          kubectl set image deployment/cadre \
            cadre=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ github.ref#refs/tags/v }} \
            -n cadre-production
