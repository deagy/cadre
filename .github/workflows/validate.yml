name: validate

# One workflow for what used to be three, in three repositories. The jobs
# that existed only to reconcile those repositories are gone:
#
#   cross-repo-integration  checked out deagy/cadre-lifecycle and
#                           deagy/cadre-profile-secure-cloud, rewrote three
#                           hardcoded /home/deagy/sdk/* paths with sed, then
#                           ran tests/integration/test_cross_repo_integration.py
#                           -- a committed 0-byte file. It had been passing
#                           without testing anything.
#   generated-content       (cadre-lifecycle) re-generated the plugin from the
#                           cadre revision pinned in cadre-ref.txt and diffed
#                           it against the committed copy. There is no
#                           committed copy now, and no pinned revision.
#
# The kernel is no longer checked out from another repository either, so
# AGENTIC_SDLC_BIN points into this tree.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  roster:
    name: roster/ (selection, knowledge store, shared policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml's requires-python floor is 3.10, but until now
        # nothing in CI ran below 3.14 -- a 3.10-only incompatibility could
        # reach a `pip install cadre` user without ever failing a build. 3.10
        # is the declared floor; 3.14 stays as the primary/latest leg.
        python-version: ["3.10", "3.14"]
    env:
      AGENTIC_SDLC_BIN: ${{ github.workspace }}/bin/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test_schema_release_drift.py diffs selection.schema.json against
          # its copy at the last `plugin-v*` release tag. The default shallow
          # checkout fetches no tags at all, which would leave that guard
          # permanently skipped -- so it fails rather than skips under CI, and
          # this is what gives it a baseline to compare against.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/requirements-validation*.lock
      # requirements-validation.lock is compiled under Python 3.14 and pins
      # rpds-py==2026.6.3, which declares Python>=3.11 -- uninstallable on
      # the 3.10 leg. requirements-validation-py310.lock is the same input
      # (.github/requirements-validation.in) recompiled under Python 3.10,
      # which resolves an older rpds-py that supports both; see that file's
      # header for the full explanation.
      - name: Select the hash-locked requirements file for this Python version
        id: lockfile
        run: |
          set -eu
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            echo "path=.github/requirements-validation-py310.lock" >> "$GITHUB_OUTPUT"
          else
            echo "path=.github/requirements-validation.lock" >> "$GITHUB_OUTPUT"
          fi
      - run: pip install --no-cache-dir --require-hashes -r ${{ steps.lockfile.outputs.path }}
      # The roster/orchestration leg that used to run here is gone with
      # test_repository_health.py, the last test module in that directory.
      # What remains there is fixture data the Go tests read
      # (select_corpus.json, select_golden.json, fixtures/, testdata/), so the
      # directory stays while the suite does not -- and `unittest discover`
      # over it would report "Ran 0 tests / NO TESTS RAN" and exit 0, passing
      # while asserting nothing, as the knowledge-store and roster/shared legs
      # did before it.
      #
      # Its 48 properties are in Go now, across internal/generators
      # (packaging, hooks, skills, removed paths, packaged selector),
      # internal/cli (wrapper, wheel, help surface, release tags) and
      # internal/kernel (compatibility window, independence).
      # Do not re-add a discover leg here without test files behind it.
      # The knowledge-store leg that used to run here is gone. Commit
      # b418031e deleted roster/knowledge-store/src and its Python tests
      # (the Go store under internal/knowledge replaces them), which left
      # `unittest discover -s roster/knowledge-store/test` reporting
      # "Ran 0 tests / NO TESTS RAN" and exiting 0 -- a step that passed
      # while asserting nothing, which is worse than no step at all.
      # The scope, classification, embedding-identity, retrieval-audit and
      # deletion-evidence guarantees it used to cover are now guarded by
      # internal/knowledge/scope_enforcement_test.go and
      # internal/contextstore/boundary_test.go, run by the `go` job below.
      # Do not re-add a discover leg here without test files behind it.
      # The roster/shared leg that used to run here is gone. Its two modules
      # -- settings.py and resolve.py -- were the last Python implementation
      # of the operator-settings resolver and the shared-policy overlay, both
      # of which internal/config now owns. Deleting their tests would have
      # left `unittest discover -s roster/shared/test` reporting "Ran 0 tests
      # / NO TESTS RAN" and exiting 0: a step that passes while asserting
      # nothing, exactly as the knowledge-store leg above did.
      #
      # What it covered is in internal/config, run by the `go` job below:
      # trust_scope_test.go (which settings a project-local file may set),
      # anchoring_test.go (which project's config is read), no_echo_test.go
      # (errors name files, never contents), yaml_dialect_test.go (the
      # PyYAML 1.1 vs yaml.v3 1.2 split), emptied_overlay_test.go and
      # autonomy_nearmiss_test.go (the narrowing-only overlay rule).
      # Do not re-add a discover leg here without test files behind it.
      - run: ./bin/cadre help
      - run: ./bin/cadre select --task "CI wrapper smoke test" --files README.md --classification internal --task-id CI-SMOKE-1 >/dev/null
      - run: ./bin/cadre schema-validate
      # The kernel is in-tree now, so these exercise the real wiring rather
      # than a SHA-pinned checkout of another repository.
      - run: ./bin/cadre sdlc --version
      - run: ./bin/cadre sdlc provider list
      - run: ./bin/cadre sdlc profile list
      - run: ./bin/cadre sdlc extension list
      - run: |
          set -eu
          for contract in provider.schema profile.schema extension.schema \
                          selection.schema agent-catalog.schema artifact.schema \
                          dispatch-bindings.schema; do
            ./bin/cadre sdlc show-contract "$contract" >/dev/null
          done

  engine:
    name: engine/ (LangGraph orchestration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies (fails on lockfile drift)
        working-directory: engine
        run: uv sync --locked
      - name: Run LangGraph engine tests
        working-directory: engine
        run: uv run pytest

  go:
    name: cmd/, internal/ (Go CLI dispatcher, Phase 1 -- ADR-001-CLI-GO-REFACTOR.md)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 for the tags, not the history.
      # internal/orchestration/schema_release_drift_test.go reads
      # selection.schema.json at the last plugin release tag with `git show`,
      # to check the emitted field set has not changed without a
      # schema_version bump. A shallow checkout has no tags, and that guard
      # fails rather than skipping under CI -- silently skipping in the one
      # place it is meant to run is the failure it exists to prevent.
      # The roster job below fetches the same way, for the same guard's
      # Python half.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # -race needs cgo; ubuntu-latest ships a C toolchain. If that ever
      # stops being true, fall back to a plain `go test ./...` leg rather
      # than disabling cgo globally, per the Makefile's test-race comment.
      - run: CGO_ENABLED=1 go test -race ./...
      # The shim a checkout actually runs: builds cmd/agentic-sdlc and execs
      # it. Checked here because this is the job that sets up Go.
      - run: ./bin/agentic-sdlc --version
      - run: ./bin/agentic-sdlc show-contract lifecycle-gates > /dev/null
      - name: gofmt (fails on any formatting diff)
        run: |
          set -eu
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt issues found in:"
            echo "$diff"
            exit 1
          fi
      # goimports and golangci-lint are pinned in go.mod's `tool` block and
      # resolved via `go tool`, never a floating `@latest` install, so this
      # job and a local `make lint`/`make fmt` run the exact same tool
      # binary go.sum already verified.
      - name: goimports (fails on any import-formatting diff)
        run: |
          set -eu
          diff="$(go tool goimports -l .)"
          if [ -n "$diff" ]; then
            echo "goimports issues found in:"
            echo "$diff"
            exit 1
          fi
      - run: go tool golangci-lint run ./...
  plugin-tools:
    name: plugin/tools (packaging, docs guards, kernel bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-validation.lock
      # test_manifest_health.py parses skill frontmatter as real YAML rather
      # than pattern-matching it -- a `description` containing ": " ends a
      # plain scalar, and that shipped four skills whose frontmatter silently
      # did not parse. Same hash-pinned lock the roster job uses.
      - run: pip install --no-cache-dir --require-hashes -r .github/requirements-validation.lock
      # One tools/ directory now: bootstrap_sdlc.py used to exist as three
      # byte-identical copies under plugins/lifecycle{,-github,-gitlab}/tools/,
      # each with its own test module and a duplication-health test holding
      # them in sync.
      - run: python3 -m unittest discover -b -s plugin/tools -p "test_*.py" -v

  cadre-pip-package:
    name: cadre pip/pipx distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Version-pinned to the exact release reviewed/verified for this job
      # (see supply-chain-security-reviewer finding on PR #48) rather than an
      # unbounded `pip install build`; not part of the hash-pinned
      # requirements-validation.lock mechanism since it is a single
      # build-only tool, not a runtime/test dependency of this repository's
      # own Python code.
      # Version-pinned to the exact releases reviewed for this job rather
      # than an unbounded install; not part of requirements-validation.lock
      # since these are build-only tools, not runtime dependencies.
      - run: pip install --no-cache-dir build==1.5.0 wheel==0.46.3
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the wheel (Go binary + roster data, no Python)
        run: make wheel
      - name: The wheel must contain no Python at all
        run: |
          set -eu
          # The whole point of Phase 2: `pip install cadre` stops shipping
          # Python. A wheel that silently regained a .py would still install
          # and still work, so nothing else would notice.
          if python -m zipfile -l dist/*.whl | grep -q '\.py$'; then
            echo "the wheel contains Python source:" >&2
            python -m zipfile -l dist/*.whl | grep '\.py$' >&2
            exit 1
          fi
          # And it must contain the binary and the data it reads. hatchling's
          # shared-data silently drops directory sources -- a wheel missing
          # every role definition builds cleanly and reports success -- so
          # these counts are the guard against that specific failure.
          python -m zipfile -l dist/*.whl | grep -q 'data/scripts/cadre' \
            || { echo "the wheel has no cadre binary" >&2; exit 1; }
          roles=$(python -m zipfile -l dist/*.whl | grep -c 'share/cadre/roster/.*/AGENT\.md' || true)
          if [ "$roles" -lt 100 ]; then
            echo "the wheel carries only $roles role definitions; expected the full roster" >&2
            exit 1
          fi
          echo "wheel: 0 python files, binary present, $roles role definitions"
      - name: Install the built wheel into an isolated prefix
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/cadre-venv"
          "$RUNNER_TEMP/cadre-venv/bin/pip" install --no-cache-dir dist/*.whl
      # Run every smoke command from outside the checkout ($RUNNER_TEMP, not
      # $GITHUB_WORKSPACE) so this only exercises what an installed
      # distribution can see on its own.
      - name: Smoke test the installed cadre distribution from outside the checkout
        run: |
          set -eu
          CADRE="$RUNNER_TEMP/cadre-venv/bin/cadre"
          WORKDIR="$RUNNER_TEMP/cadre-pip-smoke"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          echo "cadre pip/pipx distribution smoke test" > README.md

          # The installed `cadre` must be the Go binary, not a Python
          # console script. A [project.scripts] entry would generate one into
          # bin/cadre and silently overwrite the binary -- which is exactly
          # what happened the first time this wheel was built.
          file "$CADRE" | grep -qi 'ELF\|executable' \
            || { echo "installed cadre is not a native binary:" >&2; head -c 200 "$CADRE" >&2; exit 1; }

          "$CADRE" help >/dev/null

          # --version specifically, not just `help`. The version marker is
          # resolved differently from everything else, and a smoke test that
          # ran help and select shipped a build where `cadre --version` failed
          # outright from an install.
          "$CADRE" --version | grep -qE '^cadre [0-9]' \
            || { echo "installed cadre cannot report its version" >&2; "$CADRE" --version; exit 1; }

          # The task text deliberately trips two context-pack keywords, and the
          # plan is asserted rather than discarded. roster/context-packs/ is a
          # runtime resource resolved from the installed wheel, so a task that
          # matches no pack cannot detect it going unvendored -- which is
          # exactly how that shipped broken once. Two packs, not one, so a
          # single pack's definition going missing still fails the job.
          # --classification internal is load-bearing: packs declare
          # `classification: internal`, and a public or omitted classification
          # correctly withholds them, reinstating the blind spot.
          "$CADRE" select --root . \
            --task "CI pip package smoke test: redfish bmc inventory and ceph rook storage" \
            --files README.md --classification internal \
            --task-id ci-pip-smoke-1 --source ci \
            | python3 -c 'import json,sys; p=json.load(sys.stdin)["context_packs"]; ids=sorted(x["id"] for x in p); assert ids==["ceph-rook-storage-context","redfish-bmc-context"], f"expected both context packs from the installed wheel, got {ids}"'

          # The plan must name a knowledge command that actually exists. The
          # installed layout puts the binary in bin/ and the roster in
          # share/cadre/, so joining "bin/cadre" onto the installation root
          # names a path that is not there -- a plan an agent cannot execute.
          "$CADRE" select --root . \
            --task "knowledge retrieval path check" --files README.md \
            --classification internal --task-id ci-pip-smoke-2 --source ci \
            | python3 -c 'import json,os,sys; r=json.load(sys.stdin)["knowledge_context"].get("requests") or []; assert r, "expected a knowledge request"; c=r[0]["invocation"]["args"][0]; assert os.path.exists(c), f"plan names a knowledge command that does not exist: {c}"; print("knowledge command exists:", c)'

          # Maintainer/regeneration subcommands need a full checkout. From an
          # install they must fail closed -- non-zero, no raw traceback --
          # rather than writing into the installed tree.
          for cmd in generate-plugin generate-authority-aides; do
            if output=$("$CADRE" $cmd 2>&1); then
              echo "cadre $cmd unexpectedly succeeded from an installed distribution" >&2
              exit 1
            fi
            if echo "$output" | grep -qi 'Traceback'; then
              echo "cadre $cmd failed with a raw traceback instead of failing closed cleanly:" >&2
              echo "$output" >&2
              exit 1
            fi
          done

  install-sh:
    # install.sh's own unit tests (plugin/tools/test_install_script.py) only
    # pattern-match its source text -- nothing ever invoked the script, so a
    # `set -eu` violation or a non-POSIX construct could ship uncaught. This
    # job actually runs it, on both platforms it claims to support.
    #
    # install.sh shells out to the caller's own `claude`/`codex`/`cline` CLI,
    # none of which belong on a CI runner. A stub `claude` stands in so this
    # exercises the script's real control flow -- preflight, a real shallow
    # clone of this repository's public default branch, the launcher
    # symlink, and the runner dispatch -- without depending on a real Claude
    # Code install or touching anything this runner doesn't own.
    name: install.sh (executed against a stub runner CLI)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Go is required, not optional, and not reliably preinstalled. The
      # launcher these jobs install is bin/cadre, which builds and execs the Go
      # CLI on first invocation -- so "Confirm the installed launcher actually
      # works" runs a `go build`. The ubuntu image happens to ship Go and
      # macos-latest does not, which is why this job passed on one matrix leg
      # and failed on the other with "cadre: Go is required to build this
      # checkout's CLI (checked PATH for 'go')" rather than failing outright.
      # Pinned from go.mod for the same reason as the cline job below: the
      # toolchain line is satisfied from the action's cache rather than a
      # download inside the step being exercised.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scope the install to this runner's temp dir
        # Set here rather than in a job-level `env:` block: the `runner`
        # context is not available at job level, and referencing it there is
        # what GitHub rejects as a workflow file issue.
        run: |
          set -eu
          echo "CADRE_HOME=$RUNNER_TEMP/cadre-home" >> "$GITHUB_ENV"
          echo "CADRE_BIN_DIR=$RUNNER_TEMP/cadre-bin" >> "$GITHUB_ENV"
      - name: Install a stub `claude` CLI on PATH
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/stub-bin"
          cat > "$RUNNER_TEMP/stub-bin/claude" <<'SCRIPT'
          #!/bin/sh
          echo "stub-claude: $*"
          SCRIPT
          chmod +x "$RUNNER_TEMP/stub-bin/claude"
          echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"
      - name: Run install.sh end to end
        run: ./install.sh --runner=claude
      - name: Confirm the installed launcher actually works
        run: "${CADRE_BIN_DIR}/cadre help | grep -q 'Usage: cadre'"
      - name: Exercise --dry-run across every runner branch (no side effects)
        run: ./install.sh --dry-run --runner=claude,codex,cline --with-lifecycle
      - name: Run install.sh --uninstall end to end
        run: ./install.sh --uninstall --runner=claude

  install-ps1:
    # The PowerShell counterpart of install-sh above, run on its native
    # platform. Same stub-CLI approach: a real clone, a real cadre.cmd shim,
    # and a real `cadre help` invocation, without a real Claude Code install.
    name: install.ps1 (executed against a stub runner CLI)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Go is required, not optional, and not reliably preinstalled. The
      # launcher these jobs install is bin/cadre, which builds and execs the Go
      # CLI on first invocation -- so "Confirm the installed launcher actually
      # works" runs a `go build`. The ubuntu image happens to ship Go and
      # macos-latest does not, which is why this job passed on one matrix leg
      # and failed on the other with "cadre: Go is required to build this
      # checkout's CLI (checked PATH for 'go')" rather than failing outright.
      # Pinned from go.mod for the same reason as the cline job below: the
      # toolchain line is satisfied from the action's cache rather than a
      # download inside the step being exercised.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scope the install to this runner's temp dir
        # Set here rather than in a job-level `env:` block: the `runner`
        # context is not available at job level, and referencing it there is
        # what GitHub rejects as a workflow file issue.
        shell: pwsh
        run: |
          "CADRE_HOME=$(Join-Path $env:RUNNER_TEMP 'cadre-home')" | Add-Content -Path $env:GITHUB_ENV
          "CADRE_BIN_DIR=$(Join-Path $env:RUNNER_TEMP 'cadre-bin')" | Add-Content -Path $env:GITHUB_ENV
      - name: Install a stub `claude` CLI on PATH
        shell: pwsh
        run: |
          $stubDir = Join-Path $env:RUNNER_TEMP 'stub-bin'
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null
          Set-Content -Path (Join-Path $stubDir 'claude.cmd') -Value "@echo off`r`necho stub-claude: %*`r`n"
          Add-Content -Path $env:GITHUB_PATH -Value $stubDir
      - name: Run install.ps1 end to end
        shell: pwsh
        run: .\install.ps1 -Runner claude
      - name: Confirm the installed launcher actually works
        shell: pwsh
        run: |
          $output = & (Join-Path $env:CADRE_BIN_DIR 'cadre.cmd') help
          if (-not ($output -match 'Usage: cadre')) {
            throw "cadre.cmd help did not produce the expected usage text"
          }
      - name: Exercise -DryRun across every runner branch (no side effects)
        shell: pwsh
        run: .\install.ps1 -DryRun -Runner claude,codex,cline -WithLifecycle
      - name: Run install.ps1 -Uninstall end to end
        shell: pwsh
        run: .\install.ps1 -Runner claude -Uninstall

  cline-git-source:
    # A Git-source install starts at this repository root. Cline loads the
    # three entrypoints declared by root package.json and resolves their
    # plugin-owned runtime imports from this production-only dependency
    # closure; @cline/* is supplied by Cline's host sandbox.
    #
    # That last part is an assumption about Cline's installer, not something
    # this workflow can prove: the three workspace packages declare
    # @cline/sdk and @cline/shared as direct runtime dependencies, and the
    # root manifest deliberately omits them. If a Git-source install ever
    # fails on a missing @cline/* module, that assumption is what broke --
    # not this dependency closure.
    #
    # This is a standalone job rather than a step in cline-plugins below, for
    # two reasons. It must never run `npm ci` in cline-plugins/: that creates
    # a nearer node_modules, and createRequire's upward walk would then
    # resolve against the dev workspace and pass even with a broken root
    # closure. And as a step gated to one matrix leg, renaming that leg would
    # skip the check silently -- green, with no missing status check.
    name: Cline Git-source dependency closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --omit=dev
      - name: Verify Cline Git-source runtime imports resolve from each entrypoint
        run: |
          node --input-type=module -e '
            import { createRequire } from "node:module";
            import path from "node:path";
            const root = process.cwd();
            for (const entrypoint of [
              "cline-plugins/cline-agents/index.ts",
              "cline-plugins/cline-lifecycle/index.ts",
              "cline-plugins/cline/index.ts",
            ]) {
              const require = createRequire(path.join(root, entrypoint));
              require.resolve("zod");
            }
            createRequire(path.join(root, "cline-plugins/cline-agents/index.ts")).resolve("yaml");
          '

  cline-plugins:
    name: cline-plugins/* (npm test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cline, cline-agents, cline-lifecycle]
    env:
      # cline-lifecycle's "real bin/cadre sdlc subprocess calls" tests invoke
      # the actual kernel binary and assert real output, so they need one on
      # hand. The archived cadre-lifecycle repo had to `pip install` it from a
      # git URL for this job -- it lived in a different repository. Here it is
      # in the tree, so point at it directly: no network install, no version
      # pin to keep in sync, and the tests exercise the same kernel the rest
      # of this workflow does.
      AGENTIC_SDLC_BIN: ${{ github.workspace }}/bin/agentic-sdlc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cline-plugins/package-lock.json
      # cline-plugins/package.json declares npm workspaces (cline,
      # cline-agents, cline-lifecycle) backed by a single lockfile, so `npm ci`
      # runs from cline-plugins/ rather than each package directory.
      #
      # This lives outside plugin/ deliberately. While the workspace root sat
      # at plugin/package.json, installing the *Claude Code* plugin -- whose
      # marketplace source is ./plugin -- pulled this entire tree down as
      # node_modules: 263 MB and 252 packages of Cline SDK dependencies that
      # a Claude Code user never executes.
      - run: npm ci
        working-directory: cline-plugins
      # Every one of these packages shells out to `bin/cadre`, and since the
      # Python-to-Go migration that script *compiles* the CLI on first use
      # instead of exec'ing an interpreter. On a cold runner that means a
      # toolchain download plus a cgo build of go-sqlite3 -- far past the 5s
      # vitest default -- and because vitest runs test files concurrently,
      # every parallel `bin/cadre` invocation races into its own unlocked
      # build of the same cache. That is what turned this job into a wall of
      # "Test timed out in 5000ms" with orphaned cadre/go/gcc/cc1 processes.
      # Building once here makes every later invocation a cache hit.
      # setup-go is explicit rather than leaning on the runner image's
      # preinstalled Go, so the go.mod `toolchain` line is satisfied from the
      # action's cache instead of a download inside a timed test.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pre-build the Go binaries so neither compiles inside a timed test
        # Both of them: `bin/agentic-sdlc` builds and execs the Go kernel too
        # since the kernel port, and AGENTIC_SDLC_BIN above points these tests
        # straight at it. Leaving it cold reproduced the exact wall of
        # timeouts described above, one binary later.
        run: |
          ./bin/cadre help >/dev/null
          ./bin/agentic-sdlc --version >/dev/null
      - run: npm test
        working-directory: cline-plugins/${{ matrix.package }}
      - run: npm run typecheck
        working-directory: cline-plugins/${{ matrix.package }}

  generated-content:
    name: plugin/ generated content matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The generated half of plugin/ is committed because a GitHub-sourced
      # marketplace serves the repository tree -- an uncommitted distribution
      # installs a plugin with no roles in it. This job is what makes that
      # safe: source and output live in one commit, and drift fails the PR
      # that introduced it rather than being reconciled weeks later by a
      # scheduled cross-repo job.
      # --check is the generator's own comparison, so it always knows the
      # exact generated set. An earlier version of this job diffed a
      # hardcoded list of top-level directories, which silently stopped
      # covering anything newly generated -- it missed the per-plugin
      # tools/, bin/, and hooks/ fan-out entirely.
      - name: Fail on any difference from the committed distribution
        run: ./bin/cadre generate-plugin --check --output plugin

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --redact --source /repo --config /repo/.gitleaks.toml
