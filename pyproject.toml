[build-system]
# Pinned to the exact reviewed version installed/verified in this
# environment (see supply-chain-security-reviewer finding on PR #48); bump
# deliberately after review, not implicitly via an unbounded requirement.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "cadre"
dynamic = ["version"]
description = "Pip/pipx-installable distribution of the Cadre secure-cloud subagent suite CLI (select, knowledge, sdlc, init, and related subcommands)."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX-string form, paired with license-files below so hatchling
# records the actual LICENSE file as a wheel/sdist License-File (verified
# against the hatchling version pinned above -- see LICENSE at repo root).
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

# No optional dependencies. `yaml` (PyYAML) and `mcp` existed for the Python
# implementations this wheel used to vendor -- resolve.py's YAML overlay
# support and dispatch_server.py's MCP transport. The wheel ships neither any
# more, and the Go CLI reads YAML natively, so an extra that installs a
# Python package nothing in the distribution imports would be a promise the
# wheel cannot keep.
#
# `cadre mcp-dispatch-server` is served by the Go CLI. A checkout that wants
# the Python MCP server still has roster/orchestration/mcp/requirements-mcp.txt.

[project.urls]
Repository = "https://github.com/deagy/cadre"

# No [project.scripts]. The `cadre` command is the Go binary itself, installed
# from the wheel's .data/scripts/ directory -- a console-script entry here
# would generate a Python launcher into <prefix>/bin/cadre and silently
# overwrite it, which is exactly what happened the first time this was built.

# A plain text file, not a Python module. cadre_cli/_version.py was the last
# Python in this distribution; the Go CLI already parsed it as text without
# executing it, so nothing was gained by the .py extension and one file was
# lost to the elimination plan by keeping it.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
# No `packages`. This wheel contains no Python at all: it carries the
# cross-compiled Go binary and the data that binary reads. bypass-selection
# tells hatchling that is deliberate rather than a missing configuration.
bypass-selection = true

# This wheel used to be pure Python, dispatching to vendored roster/
# scripts through cadre_cli/_SUBCOMMANDS. It no longer is. The binary *is*
# the distribution -- Phase 2 of PYTHON_ELIMINATION_PLAN.md -- and no *.py
# is vendored any more.
#
# hatchling builds only the binary here. The roster data the binary reads is
# added afterwards by `make wheel`, which unpacks this wheel, copies the
# tree in, and repacks it. That split is not a workaround for tidiness:
# hatchling's shared-data maps *files only*, and a directory source produces
# no files and **no error** -- a wheel that builds successfully and is
# missing all 159 role definitions. Verified directly against hatchling
# 1.31/1.32, including with `dir/`, `dir/*` and `dir/**/*` forms.
#
# Copying the tree with exclusions, rather than enumerating 583 paths, is
# also what keeps a newly added role from silently missing the next release.

# The Go binary, staged into dist-staging/ for the platform being built.
# One wheel per (GOOS, GOARCH), each carrying only its own binary; see
# `make wheel` and the release workflow.
[tool.hatch.build.targets.wheel.shared-scripts]
"dist-staging/cadre" = "cadre"

# The sdist is a source archive, not an installable distribution. Building
# the wheel from it needs the Go toolchain and `make wheel` (see the wheel
# target above), so `pip install cadre-x.y.z.tar.gz` cannot work and is not
# offered -- releases carry per-platform wheels instead.
[tool.hatch.build.targets.sdist]
include = [
    "VERSION",
    "roster/**",
    ".agents/skills/**",
    "provider/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "roster/*/test/**",
    "roster/orchestration/examples/**",
    "roster/orchestration/runs/**",
    "roster/knowledge-store/examples/**",
    "roster/knowledge-store/proposed-knowledge/**",
    "roster/knowledge-store/data/**",
    "**/__pycache__/**",
    "**/*.pyc",
]
